name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SECURITY TODO: pin to commit SHA to prevent tag-mutation supply chain attack.
      # Run: gh api repos/actions/checkout/git/ref/tags/v4 | jq -r .object.sha
      # Then replace @v4 with @<sha> # v4.x.x
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      # SECURITY TODO: pin to commit SHA.
      # Run: gh api repos/anthropics/claude-code-action/git/ref/tags/v1 | jq -r .object.sha
      # Then replace @v1 with @<sha> # v1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
